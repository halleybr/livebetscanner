name: Deploy GitHub Pages

on:
  push:
    branches: ["main"]
  schedule:
    # Cron nativo = BACKUP (best-effort): o GitHub pode atrasar ou não disparar
    # execuções agendadas. Para ritmo confiável de ~2 min, use o agendador
    # externo (cron-job.org → workflow_dispatch) descrito em CRON-EXTERNO.md.
    # Duas expressões deslocadas (:00 e :02) para o caso de o agendamento funcionar.
    - cron: "*/5 * * * *"
    - cron: "2-59/5 * * * *"
  workflow_dispatch:

permissions:
  contents: write   # persiste data/entries.json (histórico green/red) no repo
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Generate scanner data
        run: python build.py
        env:
          MIN_LPS: "70"
          # Alertas Telegram (opcionais): sem secrets o build roda normal,
          # apenas não envia nada. Veja o README para criar o bot e os secrets.
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}

      - name: Persist entry ledger
        # Commita o histórico green/red de volta ao repositório para o próximo
        # build continuar de onde parou. Só commita quando houve mudança; o push
        # dispara uma execução extra que regenera (idêntico => sem novo commit),
        # então o ciclo para sozinho.
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/entries.json
          if git diff --cached --quiet; then
            echo "Ledger inalterado — nada a commitar"
          else
            git commit -m "chore(data): atualiza registro de entradas" || true
            git pull --rebase origin main || true
            git push origin main || true
          fi

      - name: Assemble static site
        run: |
          rm -rf _site
          mkdir -p _site/static _site/api
          cp static/index.html _site/index.html
          cp static/style.css static/app.js _site/static/
          cp api/scanner.json _site/api/scanner.json

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
